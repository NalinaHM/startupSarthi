name: Build StartupSarthi Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Live Vercel Backend URL (e.g. https://startupsarthi.vercel.app)"
        required: false
        default: ""

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.VITE_API_BASE_URL || '' }}
          VITE_GEMINI_MODEL: ${{ vars.VITE_GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload StartupSarthi APK
        uses: actions/upload-artifact@v4
        with:
          name: StartupSarthi-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
